{% extends 'base.html' %}

{% block body %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Lista de Tutores</h2>
        <a href="{% url 'tutors:tutor_create' %}" class="btn btn-primary">Novo Tutor</a>
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>Foto</th>
                <th>Pessoa</th>
                <th class="text-end">Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for tutor in object_list %}
            <tr>
                <td>
                    {% if tutor.photo %}
                        <img src="{{ tutor.photo.url }}" alt="{{ tutor.person.name }}" class="rounded-circle" style="width: 40px; height: 40px; object-fit: cover;">
                    {% else %}
                        <span class="text-muted">Sem foto</span>
                    {% endif %}
                </td>
                <td>{{ tutor.person.name }}</td>
                <td class="text-end">
                    <a href="{% url 'tutors:tutor_update' tutor.pk %}" class="btn btn-sm btn-warning">Editar</a>
                    <a href="{% url 'tutors:tutor_delete' tutor.pk %}" class="btn btn-sm btn-danger">Excluir</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" class="text-center text-muted">Nenhum tutor registado.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock body %}
