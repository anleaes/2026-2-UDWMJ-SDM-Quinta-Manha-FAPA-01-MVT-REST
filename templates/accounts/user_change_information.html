{% extends 'base.html' %}

{% block title %}
Alterar usuário - {{ block.super }}
{% endblock title %}

{% block body %}

<b>Alterar usuário</b>
<form action="" method="POST">
    {% csrf_token %}
    <label>Nome</label>
    <br />
    {{ form.first_name }}
    <br />
    <br />
    <label>Sobrenome</label>
    <br />
    {{ form.last_name }}
    <br />
    <br />
    <label>E-mail</label>
    <br />
    {{ form.email }}
    <br />
    <br />
    <button type="submit">Salvar</button>
</form>

{% endblock body %}
