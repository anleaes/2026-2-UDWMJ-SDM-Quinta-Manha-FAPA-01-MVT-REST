{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="{% static 'css/arquivo_com_estilos.css' %}">
    <title>Entrar - VetApp - Ambulatório Veterinário</title>
</head>

<body class="core_body">

    <main class="login">
        <p class="marca">
            VetApp
            <span>Ambulatório Veterinário</span>
        </p>

        <form action="" method="POST">
            {% csrf_token %}
            <b>Identifique-se</b>
            <label>Usuário</label>
            <input type="text" id="username" name="username" placeholder="Nome de usuário" required autofocus>
            <label>Senha</label>
            <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
            <button type="submit">Entrar</button>
            <a href="{% url 'accounts:add_user' %}">Criar uma conta</a>
        </form>
    </main>

    <script src="{% static 'js/arquivo_com_javascript.js' %}"></script>
</body>

</html>
