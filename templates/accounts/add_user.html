{% extends 'base.html' %}

{% block title %}
Novo usuário - {{ block.super }}
{% endblock title %}

{% block body %}

<b>Novo usuário</b>
<a href="{% url 'accounts:user_login' %}">Voltar para o login</a>
<form action="" method="POST">
    {% csrf_token %}
    <label>Nome</label>
    <br />
    {{ form.first_name }}
    <br />
    <br />
    <label>Sobrenome</label>
    <br />
    {{ form.last_name }}
    <br />
    <br />
    <label>Nome de usuário</label>
    <br />
    {{ form.username }}
    <br />
    <br />
    <label>E-mail</label>
    <br />
    {{ form.email }}
    <br />
    <br />
    <label>Senha</label>
    <br />
    {{ form.password }}
    <br />
    <br />
    <button type="submit">Salvar</button>
</form>

{% endblock body %}
